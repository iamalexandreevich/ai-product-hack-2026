<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="PreToolUse: агент → шов харнесса → плагин → POST /v1/decide → ступень 1 (правила) → ступень 2 (модель) → вердикт">
  <style>
    .disp { font-family: Impact, "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-weight: 900; }
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace; }
    .flow { stroke: #7B4FD6; stroke-width: 2; fill: none; stroke-dasharray: 8 8; animation: dash 1.2s linear infinite; }
    .flow.lime { stroke: #B6FF2E; }
    .packet { animation: travel 4.5s linear infinite; }
    .st1 { animation: glow 4.5s linear infinite; }
    .st2 { animation: glow 4.5s linear infinite; animation-delay: 1.4s; }
    .verdict { animation: verdict 4.5s linear infinite; }
    .vtext { animation: vflash 4.5s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -32 } }
    @keyframes travel { 0% { transform: translateX(0); opacity: 0 } 5% { opacity: 1 } 95% { opacity: 1 } 100% { transform: translateX(1040px); opacity: 0 } }
    @keyframes glow { 0%,25%,60%,100% { stroke: #2A1F45 } 35%,50% { stroke: #B6FF2E } }
    @keyframes verdict { 0%,85% { opacity: .75 } 92%,100% { opacity: 1 } }
    @keyframes vflash { 0%,85% { fill: #A397C2 } 92%,100% { fill: #FF2E4A } }
  </style>
  <rect width="1200" height="460" fill="#0B0714"/>
  <text class="mono" x="40" y="36" font-size="11" letter-spacing="3" fill="#B6FF2E">PRETOOLUSE · ДО ВЫЗОВА ИНСТРУМЕНТА · POST /v1/decide</text>

  <!-- flow line -->
  <path class="flow" d="M130 150 H1170"/>
  <circle class="packet" cx="130" cy="150" r="6" fill="#B6FF2E"/>

  <!-- 1 agent -->
  <g transform="translate(40,90)">
    <rect width="180" height="120" fill="#17102A" stroke="#2A1F45"/>
    <text class="mono" x="14" y="22" font-size="10" letter-spacing="2" fill="#7D7391">1 · АГЕНТ</text>
    <text class="disp" x="14" y="52" font-size="20" fill="#F2EEFB">ToolCall</text>
    <text class="mono" x="14" y="76" font-size="12" fill="#FF6A00">shell: <tspan fill="#F2EEFB">rm -rf ./build</tspan></text>
    <text class="mono" x="14" y="98" font-size="11" fill="#A397C2">просьба: «почисти сборку»</text>
  </g>

  <!-- 2 seam + plugin -->
  <g transform="translate(240,90)">
    <rect width="210" height="120" fill="#17102A" stroke="#2A1F45"/>
    <text class="mono" x="14" y="22" font-size="10" letter-spacing="2" fill="#7D7391">2 · ШОВ ХАРНЕССА + ПЛАГИН</text>
    <text class="disp" x="14" y="52" font-size="20" fill="#F2EEFB">permission.ask</text>
    <text class="mono" x="14" y="76" font-size="10" fill="#A397C2">kilo · opencode · codex · pi · dsh</text>
    <text class="mono" x="14" y="98" font-size="11" fill="#A397C2">собирает запрос, зовёт ядро</text>
  </g>

  <!-- 3 stage 1 -->
  <g transform="translate(470,70)">
    <rect class="st1" width="340" height="160" fill="#7B4FD6" stroke="#2A1F45" stroke-width="3"/>
    <text class="disp" x="14" y="34" font-size="26" fill="#F2EEFB">MELCHIOR·1</text>
    <text class="mono" x="14" y="54" font-size="10" letter-spacing="1" fill="#D9CCFF">СТУПЕНЬ 1 · ПРАВИЛА · ~1 МС · 0 ТОКЕНОВ</text>
    <text class="mono" x="14" y="80" font-size="11" fill="#F2EEFB">hard-deny  curl…|sh · rm -rf / · sudo</text>
    <text class="mono" x="14" y="98" font-size="11" fill="#F2EEFB">rules      deny / ask / allow пилота</text>
    <text class="mono" x="14" y="116" font-size="11" fill="#F2EEFB">profile    пути · ветки · домены · MCP</text>
    <text class="mono" x="14" y="134" font-size="11" fill="#F2EEFB">allowlist  npm test · git status …</text>
    <text class="mono" x="14" y="150" font-size="10" fill="#B6FF2E">■ ONLINE</text>
  </g>

  <!-- 4 stage 2 -->
  <g transform="translate(830,70)">
    <rect class="st2" width="340" height="160" fill="#7B4FD6" stroke="#2A1F45" stroke-width="3"/>
    <text class="disp" x="14" y="34" font-size="26" fill="#F2EEFB">BALTHASAR·2</text>
    <text class="mono" x="14" y="54" font-size="10" letter-spacing="1" fill="#D9CCFF">СТУПЕНЬ 2 · МОДЕЛЬ · STRUCTURED OUTPUT</text>
    <text class="mono" x="14" y="80" font-size="11" fill="#F2EEFB">видит: профиль · [TASK] · [HISTORY]</text>
    <text class="mono" x="14" y="98" font-size="11" fill="#F2EEFB">[ACTION] · [FLAGS] · заметку ступени 1</text>
    <text class="mono" x="14" y="116" font-size="11" fill="#F2EEFB">не видит: рассуждения агента, metadata</text>
    <text class="mono" x="14" y="134" font-size="11" fill="#F2EEFB">любой сбой / таймаут → ask</text>
    <text class="mono" x="14" y="150" font-size="10" fill="#B6FF2E">■ ONLINE</text>
  </g>

  <!-- verdict row -->
  <g class="verdict" transform="translate(40,270)">
    <rect width="1130" height="64" fill="#17102A"/>
    <rect width="6" height="64" fill="#7B4FD6"/>
    <text class="mono" x="24" y="27" font-size="11" fill="#7D7391">ВЕРДИКТ · shell · rm -rf ./build · profile default-dev · session sess-42</text>
    <text class="mono" x="24" y="48" font-size="11" fill="#A397C2">reason: «recursive delete outside allowed paths» · suggest: rm -rf ./build/cache</text>
    <text class="disp vtext" x="880" y="42" font-size="26" fill="#FF2E4A">否定 ЗАПРЕЩЕНО</text>
    <text class="mono" x="1110" y="27" font-size="10" fill="#7D7391" text-anchor="end">stage 1</text>
    <text class="mono" x="1110" y="48" font-size="10" fill="#7D7391" text-anchor="end">0.8 мс</text>
  </g>

  <!-- legend -->
  <g transform="translate(40,360)" class="mono" font-size="12">
    <rect width="12" height="12" y="-10" fill="#B6FF2E"/><text x="20" fill="#A397C2">allow — кэшируется на сессию; deny и ask — никогда</text>
    <rect width="12" height="12" x="0" y="20" fill="#FF2E4A"/><text x="20" y="30" fill="#A397C2">hard-deny не переопределяется ни моделью, ни эскалацией, ни правилом пилота</text>
    <rect width="12" height="12" x="0" y="50" fill="#FFC93A"/><text x="20" y="60" fill="#A397C2">fail-closed: ошибка, таймаут, неразобранная команда, недоступный гард → ask</text>
  </g>
  <text class="mono" x="1070" y="440" font-size="10" fill="#7D7391" text-anchor="end">CASPER·3 · STANDBY</text>
  <rect x="0" y="454" width="1200" height="6" fill="#7B4FD6"/>
</svg>
