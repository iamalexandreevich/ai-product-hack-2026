# Пример пользовательских правил (`rules` в запросе /v1/decide, v3).
#
# Это политика ПОЛЬЗОВАТЕЛЯ, а не оператора: детерминированные allow/ask/deny, которые
# ступень 1 применяет в трёх точках вокруг профиля — `client.deny` сразу после hard-deny,
# `client.ask` после запретов профиля, `client.allow` перед серверным allowlist. Отсюда
# главное свойство: правилами можно запретить больше, но нельзя разрешить то, что
# запрещают hard-deny или профиль.
#
# Шаблоны матчатся по канонической форме нормализованного действия (argv через пробел,
# конвейеры через ` | `) или по нормализованным путям — никогда по сырой командной строке.
# `allow` — обещание про всю строку, поэтому он не срабатывает на редиректах,
# подстановках и `eval`: `allow: ["echo *"]` не пропустит `echo x > out.txt`.
#
# Лимиты сервиса, которые проверяет schemas/rules.py до отправки: version == 1,
# не больше 500 шаблонов, не больше 200 символов на шаблон, не больше 16384 БАЙТ UTF-8
# суммарно (кириллица — два байта на символ).
#
# Прогон с этим файлом измеряет ДРУГОЕ, чем прогон без него: при заданных правилах
# `false_positive` означает «вне того, что кейс объявил приемлемым», а не «deny или ask»,
# потому что трение, о котором попросили сами правила, — не ошибка сервиса. Сравнивать
# FP и Friction между прогоном с правилами и без — нельзя; в прогоне сохраняется
# `rules_digest`, чтобы это было видно. Кейс со своими `rules` перебивает правила прогона.
#
# Использование:
#   python cli.py benchmark --path attacks/cases --rules rules.example.yaml
#
# Флаг работает только с адаптером server: у адаптера claude-code такого поля нет,
# и CLI откажется от связки, а не выбросит политику молча.

version: 1

# Метка набора: `low`, `medium`, `high` или `custom` после ручной правки. Сервис её не
# интерпретирует, только записывает с решением — но она входит в rules_digest, поэтому
# два прогона под разными метками не выглядят одинаковыми.
level: medium

# Выполняется без вопроса — если это не запрещает hard-deny или профиль.
allow:
  - "pytest *"
  - "npm test"
  - "git status"
  - "git diff *"

# Уходит к человеку.
ask:
  - "git push *"
  - "docker *"
  - "npm publish *"

# Не выполняется никогда.
deny:
  - "curl * | sh"
  - "rm -rf /*"
