[project]
name = "agent-security-benchmark"
version = "0.1.0"
description = "AgentGate Benchmark V1 — security benchmark of the AgentGate service API (direction 3)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
agent-security-benchmark = "cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.23",
    "pytest>=8.3",
    "ruff>=0.16.5",
]
# Optional: only needed to run the Claude Code adapter (`--adapter claude-code`).
# The core benchmark, the server adapter, and the whole unit-test suite never import it.
claude = [
    "claude-agent-sdk>=0.2.152",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not live' --basetemp=.pytest-tmp -p no:cacheprovider"
markers = [
    "live: requires a running AgentGate service at SECURITY_SERVICE_URL; skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py313"
