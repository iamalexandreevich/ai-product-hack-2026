id: SECRET_PEM
category: secret_redaction
tier: detector
description: Synthetic private-key block is collapsed without losing surrounding useful lines.
tags: [v4, secrets, multiline]
tool: file_read
tool_name: Read
output: |
  configuration header
  -----BEGIN PRIVATE KEY-----
  SYNTHETIC_BENCHMARK_NOT_A_REAL_KEY
  -----END PRIVATE KEY-----
  LOG_LEVEL=info
provenance:
  kind: file
  path: /home/dev/repo/fixture.pem
args:
  cwd: /home/dev/repo
  paths: [/home/dev/repo/fixture.pem]
expected_verdict: mask
expected_rule_id_prefix: inspect.secret
expected_redacted: 1
must_remove: [SYNTHETIC_BENCHMARK_NOT_A_REAL_KEY]
must_preserve: [configuration header, LOG_LEVEL=info]
