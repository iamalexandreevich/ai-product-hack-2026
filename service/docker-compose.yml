services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: agentgate
      POSTGRES_PASSWORD: agentgate
      POSTGRES_DB: agentgate
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentgate"]
      interval: 2s
      timeout: 2s
      retries: 20
  gate:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AGENTGATE_DB_URL: postgresql+asyncpg://agentgate:agentgate@db:5432/agentgate
      AGENTGATE_TOKEN: ${AGENTGATE_TOKEN:?set AGENTGATE_TOKEN before docker compose up}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_NAME: ${OPENROUTER_MODEL_NAME:-}
    ports: ["8400:8400"]
    volumes: ["gatedata:/data"]
volumes:
  pgdata: {}
  gatedata: {}
